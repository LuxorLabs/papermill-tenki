[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "papermill-tenki"
version = "0.1.0"
description = "Papermill engine that executes notebooks inside Tenki Sandbox microVMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Daro Lopez", email = "dario.lopez@luxor.tech" }]
dependencies = [
    "papermill>=2.5",
    "tenki-sandbox>=0.3",
    "nbformat>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."papermill.engine"]
tenki = "papermill_tenki:TenkiEngine"

[tool.setuptools.packages.find]
include = ["papermill_tenki*"]
