[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "papermill-tenki"
dynamic = ["version"]
description = "Papermill engine that executes notebooks inside Tenki Sandbox microVMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Daro Lopez", email = "dario.lopez@luxor.tech" }]
keywords = ["papermill", "jupyter", "notebook", "tenki", "sandbox", "engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "papermill>=2.5",
    "tenki>=0.5.4",
    "nbformat>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/darolpz-luxor/papermill-tenki"

[project.entry-points."papermill.engine"]
tenki = "papermill_tenki.engine:TenkiEngine"

[tool.setuptools.dynamic]
version = { attr = "papermill_tenki.__version__" }

[tool.setuptools.packages.find]
include = ["papermill_tenki*"]
